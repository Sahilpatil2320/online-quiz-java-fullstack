spring.application.name=sqrock-quiz
server.port=${PORT:8080}

# Optional untracked file with your local secrets (see application-local.properties.example)
spring.config.import=optional:file:./application-local.properties

# --- MySQL (override with environment variables or application-local.properties) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quiz_app}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:quiz_user}
spring.datasource.password=${DB_PASSWORD:}

# The schema is created by database/schema.sql (reproducible), Hibernate never changes it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- CORS: origins allowed to call the API (React dev server) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Auth ---
app.auth.token-ttl-hours=12
# First administrator is created at startup ONLY if both values are provided (never hardcoded).
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
